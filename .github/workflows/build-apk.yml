name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Publish build log + APK as a GitHub Release (always)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chimy's Mood build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            build_log.txt
          fail_on_unmatched_files: false

      - name: Fail job if the build actually failed
        if: steps.build.outcome == 'failure'
        run: exit 1
